[project]
name = "sniff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "scipy>=1.16.2",
    "typer>=0.20.0",
]
[tool.uv]
package = true
[project.scripts]
sniff = "sniff.scripts.run_protocol:app"
[tool.pytest.ini_options]
norecursedirs = ["sniff-ros2"]
